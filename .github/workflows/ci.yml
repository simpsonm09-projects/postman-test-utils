name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Check formatting
        run: just fmt-check
  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Fetch the shared hook config
        run: lefthook install
      - name: Assert the merged config
        run: |
          dump=$(lefthook dump)
          for job in core-fmt core-forbidden-files core-policy owner-signing; do
            grep -q "name: $job" <<<"$dump" || {
              echo "::error::the shared hook config did not load job $job"
              exit 1
            }
          done
      - name: Validate hook config
        run: lefthook validate

  lint:
    if: github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/repo-standard/.github/workflows/lint.yml@1744bc70df3301d96276452a12a80394a704e7ff # repo-standard, pinned commit
  aislop:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/aislop.yml@1744bc70df3301d96276452a12a80394a704e7ff # repo-standard, pinned commit
  security:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/security.yml@1744bc70df3301d96276452a12a80394a704e7ff # repo-standard, pinned commit
  standard:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/standard.yml@1744bc70df3301d96276452a12a80394a704e7ff # repo-standard, pinned commit
  coverage:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/coverage.yml@1744bc70df3301d96276452a12a80394a704e7ff # repo-standard, pinned commit

  typecheck:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Restore the npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: mise exec -- npm ci
      - name: Typecheck
        run: just typecheck

  test:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Restore the npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: mise exec -- npm ci
      - name: Build
        run: just build
      - name: Test
        run: just test
